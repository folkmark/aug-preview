name: Deploy site to GitHub Pages

# Builds and publishes the AugmentED site. tools/build-site.mjs assembles the
# site — a file per page, the assets, .nojekyll and a 404.html — and fails if
# the pages reference anything the artifact does not contain.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys all come off main, so they still serialise; pull request builds get
# their own group rather than queueing behind a deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository's Pages source has to be "GitHub Actions" for this deploy
      # to be the one that serves. enablement switches it over, which also stops
      # the built-in branch build from racing this workflow — and that build
      # publishes the repository as-is, without the per-page route files.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # base_path is only needed for 404.html, which is served from arbitrary
      # URLs and so cannot use relative references. On pull requests it is empty
      # and the build falls back to "/" — enough to verify the pages resolve.
      - name: Build site
        run: node tools/build-site.mjs _site "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
