name: Deploy site to GitHub Pages

# Publishes the AugmentED site so the Pages URL opens straight onto the home
# page. index.html and the files it references (assets/, _ds/, support.js) live
# at the repository root; this job copies just those into the published site,
# leaving the working material under project/ out of the deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html support.js scroll-world.js _site/
          cp -R assets _site/assets
          cp -R _ds _site/_ds

          # Pages runs Jekyll unless this marker is present, and Jekyll drops
          # every directory whose name starts with an underscore — which would
          # take _ds/ (the design tokens and component bundle) with it.
          touch _site/.nojekyll

          # The site routes client-side, so unknown paths should land on the
          # home page rather than the default Pages 404.
          cp _site/index.html _site/404.html

      - name: Verify the assembled site
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -f _site/.nojekyll
          test -s _site/support.js
          test -d _site/_ds
          # Every relative src/href in the page must exist in the artifact.
          missing=0
          while read -r ref; do
            [ -e "_site/$ref" ] || { echo "missing: $ref"; missing=1; }
          done < <(grep -oE '(src|href)="[^"#][^":]*"' _site/index.html \
                   | sed -E 's/^(src|href)="//; s/"$//' \
                   | grep -vE '^(https?:|//|mailto:|data:)' \
                   | sed 's|^\./||' | sort -u)
          [ "$missing" -eq 0 ] || { echo "::error::assembled site has broken relative references"; exit 1; }
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
