name: Publish site to gh-pages

# Builds the AugmentED site and publishes it to the gh-pages branch, which is what
# GitHub Pages serves. tools/build-site.mjs assembles the artifact — a file per
# page, the assets, .nojekyll, CNAME and a 404.html — and fails if the pages
# reference anything the artifact does not contain. What is in the repository but not
# served (the design system's dev files and .otf sources, the parked Approach scrub)
# is left out there, in copyDir(), because this job publishes whatever _site holds.
#
# A second job, `plugin`, checks and packages the WordPress plugin
# (wordpress-handoff/plugin/augmented-ed/). It runs beside the site build, never before
# it, so a stale plugin fails its own check and cannot stop the site from publishing.
#
# gh-pages holds build output and nothing else, so each publish replaces it with a
# single orphan commit rather than adding to it. Left to accumulate it would carry
# every superseded copy of every re-encoded frame forever, which is how the branch
# reached 38 MB of history for a 20 MB site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Publishes all come off main, so they serialise; pull request builds get their own
# group rather than queueing behind one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # basePath is only needed for 404.html and the redirect stubs, which are served
      # from arbitrary URLs and so cannot use relative references. The custom domain
      # serves from the root, which is what the default gives.
      - name: Build site
        run: node tools/build-site.mjs _site

      # A pull request gets the build as a check and stops there: the verify step
      # inside build-site.mjs is the point, not the publish. Only main publishes. A
      # manual run is allowed from any branch, and without the ref test it would
      # force-push that branch's build over the live site, in a concurrency group of
      # its own, so not even queued behind a publish from main.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:gh-pages

  # The WordPress plugin. Its page templates, stylesheet and data are generated from the
  # committed export by tools/build-wp-plugin.mjs, and committed; --check regenerates them in
  # memory and fails if the committed files differ, so a change to index.html that was
  # re-exported but not regenerated cannot merge unnoticed. It also runs php -l over the
  # plugin and renders all 29 team tiles through PHP against the export.
  #
  # The assembled plugin — the runtime plus exactly the assets the pages use, about 22 MB —
  # is uploaded as this run's artifact. Download it from the run's summary page: the zip
  # GitHub gives you has augmented-ed/ at its root, which is what WordPress's Upload Plugin
  # expects. It is never published anywhere public: it packages the licensed Avenir files.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the generator's dependencies
        run: npm i --no-save linkedom@0.18.13 postcss@8.5.28 postcss-selector-parser@7.1.6

      - name: Check the plugin matches the export
        run: node tools/build-wp-plugin.mjs --check

      - name: Assemble the plugin
        run: node tools/build-wp-plugin.mjs --assemble dist

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: augmented-ed-plugin
          path: dist/
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}
