name: Publish site to gh-pages

# Builds the AugmentED site and publishes it to the gh-pages branch, which is what
# GitHub Pages serves. tools/build-site.mjs assembles the artifact — a file per
# page, the assets, .nojekyll, CNAME and a 404.html — and fails if the pages
# reference anything the artifact does not contain.
#
# gh-pages holds build output and nothing else, so each publish replaces it with a
# single orphan commit rather than adding to it. Left to accumulate it would carry
# every superseded copy of every re-encoded frame forever, which is how the branch
# reached 38 MB of history for a 20 MB site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Publishes all come off main, so they serialise; pull request builds get their own
# group rather than queueing behind one.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # basePath is only needed for 404.html and the redirect stubs, which are served
      # from arbitrary URLs and so cannot use relative references. The custom domain
      # serves from the root, which is what the default gives.
      - name: Build site
        run: node tools/build-site.mjs _site

      # A pull request gets the build as a check and stops there: the verify step
      # inside build-site.mjs is the point, not the publish.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          cd _site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:gh-pages
